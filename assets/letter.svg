<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="title description">
  <title id="title">A letter from Mudit</title>
  <desc id="description">Mudit shares his curiosity for building, his work as an AI Technical Product Manager, and the personal experiment that became LocalTV Remote. The full letter is available as plain text below the image.</desc>
  <style>
    text { fill: #191919; font-family: Georgia, 'Times New Roman', serif; }
    .body { font-size: 26px; }
  </style>
  <rect width="1000" height="1220" fill="#ffffff"/>
  <text x="80" y="130" font-size="54" letter-spacing="-1.5">Hey, I'm Mudit.</text>
  <text x="920" y="130" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="-2" aria-label="M7 company logo">M7</text>
  <g class="body">
    <text x="80" y="210">
      <tspan x="80">I love building things. I'm naturally curious, and I enjoy turning</tspan>
      <tspan x="80" dy="39">what I learn into solutions for problems I face or see others facing.</tspan>
    </text>
    <text x="80" y="315">
      <tspan x="80">During the week, I work as an AI Technical Product Manager at an</tspan>
      <tspan x="80" dy="39">enterprise AI company, where I help build solutions for Fortune 50</tspan>
      <tspan x="80" dy="39">and Fortune 500 companies, along with our core AI platform.</tspan>
    </text>
    <text x="80" y="459">
      <tspan x="80">Outside of work, you'll often find me experimenting with new</tspan>
      <tspan x="80" dy="39">technologies, exploring ideas on GitHub, and building things simply</tspan>
      <tspan x="80" dy="39">because I'm curious to see if they work.</tspan>
    </text>
    <text x="80" y="603">
      <tspan x="80">One of those experiments was a small remote control app I built to</tspan>
      <tspan x="80" dy="39">solve a problem of my own. To my surprise, it started getting traction</tspan>
      <tspan x="80" dy="39">from people who found it useful. You can read more about it <tspan text-decoration="underline">here</tspan>.</tspan>
    </text>
    <text x="80" y="747">
      <tspan x="80">I'm still learning, experimenting, and figuring things out. Some ideas</tspan>
      <tspan x="80" dy="39">work, others don't. But I enjoy the process of building them either way.</tspan>
    </text>
    <text x="80" y="852">Thanks for stopping by. I'm glad you're here.</text>
    <text x="920" y="965" text-anchor="end">With love,</text>
  </g>
